name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -e '.[dev]'
      - name: Scan public source and history
        run: python tools/check_public_repo.py --history
      - name: Run Python tests
        run: pytest -q

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Java gateway tests
        run: mvn -q -f java-gateway/pom.xml test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: botmux-plugin-data-mcp/package-lock.json
      - name: Validate BotMux plugin
        working-directory: botmux-plugin-data-mcp
        run: npm ci --ignore-scripts && npm test
