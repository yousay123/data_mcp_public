[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ksher-agent-data-mcp"
version = "0.3.0"
description = "Secure MCP service for agent-governed TChouse data access"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=42.0.0",
  "fastapi>=0.111.0",
  "mcp>=1.9.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "pymysql>=1.1.1",
  "sqlglot>=25.0.0",
  "structlog>=24.1.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
]
jdbc = [
  "jaydebeapi>=1.2.3",
  "jpype1>=1.5.0",
]
[project.scripts]
ksher-agent-data-mcp = "ksher_agent_data_mcp.server:main"
ksher-agent-data-mcp-kai = "ksher_agent_data_mcp.kai_bootstrap:main"
ksher-agent-data-api = "ksher_agent_data_mcp.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ksher_agent_data_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
